version: '1'

services:

    qdrant:
        image: qdrant/qdrant
        container_name: qdrant
        ports:
            - "6333:6333"
            - "6334:6334"
    
    zookeeper:
        image: wurstmeister/zookeeper
        ports:
        - "2181:2181"
        # networks:
        #   - app-network

    kafka:
        image: wurstmeister/kafka
        ports:
        - "9092:9092"
        environment:
        KAFKA_ADVERTISED_HOST_NAME: localhost
        KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
        depends_on:
        - zookeeper