version: '3.8'

services:
    qdrant-db:
        image: qdrant/qdrant
        ports:
            - "6333:6333"
            - "6334:6334"
        volumes:
            - ./data-qdrant:/qdrant/storage
    recall:
        build:
            context: .
            dockerfile: Dockerfile.recall
        volumes:
            - .:/recall
        ports:
            - "8005:8005"
        depends_on:
            - qdrant-db
        env_file:
            - .env
    quadrant-store:
        build:
            context: .
            dockerfile: Dockerfile.Quad.db
        depends_on:
            - qdrant-db
        command: ["python", "recall_ai/config/quad_gen_vector_embedding.py"]

    screenshot-service:
        build:
            context: .
            dockerfile: Dockerfile.Screenshot
        depends_on:
            - qdrant-db
        command: ["python", "recall_ai/src/mss_screen.py"]