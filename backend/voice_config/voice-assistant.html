<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Voice Assistant</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
    }

    .container {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 600px;
      width: 90%;
    }

    h2 {
      margin-bottom: 30px;
      font-size: 2.5em;
      font-weight: 300;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
    }

    .mic-container {
      position: relative;
      margin: 30px 0;
    }

    #micBtn {
      background: linear-gradient(45deg, #ff6b6b, #ee5a52);
      border: none;
      border-radius: 50%;
      width: 120px;
      height: 120px;
      font-size: 40px;
      color: white;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
      position: relative;
      overflow: hidden;
    }

    #micBtn::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: all 0.3s ease;
    }

    #micBtn:hover::before {
      width: 100%;
      height: 100%;
    }

    #micBtn:hover {
      transform: scale(1.1);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.3);
    }

    #micBtn.recording {
      background: linear-gradient(45deg, #ff4757, #c44569);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    #micBtn:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
    }

    .test-btn {
      background: linear-gradient(45deg, #5f27cd, #741b47);
      border: none;
      border-radius: 10px;
      padding: 15px 25px;
      color: white;
      cursor: pointer;
      font-size: 16px;
      margin: 10px;
      transition: all 0.3s ease;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }

    .test-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
    }

    #status {
      margin: 20px 0;
      font-size: 18px;
      font-weight: 500;
      min-height: 25px;
      opacity: 0.9;
    }

    .output-section {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 15px;
      padding: 25px;
      margin: 20px 0;
      text-align: left;
    }

    .output-label {
      font-weight: bold;
      color: #ffd700;
      margin-bottom: 10px;
      font-size: 16px;
    }

    .output-text {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 10px;
      padding: 15px;
      min-height: 20px;
      font-size: 16px;
      line-height: 1.4;
      word-wrap: break-word;
    }

    #speakBtn {
      background: linear-gradient(45deg, #00d2d3, #54a0ff);
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      color: white;
      cursor: pointer;
      font-size: 16px;
      margin-top: 15px;
      transition: all 0.3s ease;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }

    #speakBtn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
    }

    #speakBtn:disabled {
      background: #666;
      cursor: not-allowed;
      transform: none;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .error {
      color: #ff6b6b;
      font-weight: bold;
    }

    .success {
      color: #2ed573;
      font-weight: bold;
    }

    .warning {
      color: #ffa502;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>🎤 Voice Assistant</h2>
    
    <div class="controls">
      <button class="test-btn" onclick="testVoiceOutput()">🧪 Test Voice Output</button>
      <button class="test-btn" onclick="testMicrophone()">🎙️ Test Microphone</button>
    </div>

    <div class="mic-container">
      <button id="micBtn">🎙️</button>
    </div>

    <div id="status">Ready to record</div>

    <div class="output-section">
      <div class="output-label">You said:</div>
      <div class="output-text" id="transcription">Press the microphone button to start recording...</div>
    </div>

    <div class="output-section">
      <div class="output-label">Response:</div>
      <div class="output-text" id="response">Waiting for your input...</div>
      <button id="speakBtn" style="display: none;">🔊 Speak Response</button>
    </div>
  </div>

  <script>
    const micBtn = document.getElementById("micBtn");
    const transcriptionEl = document.getElementById("transcription");
    const responseEl = document.getElementById("response");
    const statusEl = document.getElementById("status");
    const speakBtn = document.getElementById("speakBtn");

    let mediaRecorder;
    let audioChunks = [];
    let isRecording = false;
    let currentResponse = "";

    // Configuration
    const SERVER_URL = "http://localhost:8020"; // Update this to match your server
    const RECORDING_TIMEOUT = 30000; // 30 seconds max recording

    // Initialize on page load
    window.addEventListener("load", initializeApp);

    function initializeApp() {
      updateStatus("Initializing voice assistant...");
      
      // Check browser support
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        updateStatus("Microphone access not supported in this browser", "error");
        return;
      }

      if (!window.speechSynthesis) {
        updateStatus("Text-to-speech not supported in this browser", "warning");
      }

      // Load voices
      loadVoices();
      updateStatus("Ready to record", "success");
    }

    function updateStatus(message, type = "info") {
      statusEl.textContent = message;
      statusEl.className = type;
      console.log(`Status: ${message}`);
    }

    function loadVoices() {
      return new Promise((resolve) => {
        let voices = speechSynthesis.getVoices();
        if (voices.length > 0) {
          resolve(voices);
        } else {
          speechSynthesis.onvoiceschanged = () => {
            voices = speechSynthesis.getVoices();
            resolve(voices);
          };
        }
      });
    }

    async function testVoiceOutput() {
      updateStatus("Testing voice output...");
      try {
        await speakText("Hello! This is a voice test. The text-to-speech system is working correctly.");
        updateStatus("Voice test completed", "success");
      } catch (error) {
        updateStatus("Voice test failed", "error");
        console.error("Voice test error:", error);
      }
    }

    async function testMicrophone() {
      updateStatus("Testing microphone access...");
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        stream.getTracks().forEach(track => track.stop());
        updateStatus("Microphone access granted", "success");
      } catch (error) {
        updateStatus("Microphone access denied", "error");
        console.error("Microphone test error:", error);
      }
    }

    async function speakText(text) {
  return new Promise(async (resolve, reject) => {
    if (!text || text.trim() === "" || text === "Waiting for your input...") {
      console.warn("No valid text to speak.");
      resolve();
      return;
    }

    try {
      speechSynthesis.cancel(); // Stop any ongoing speech

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 0.9;
      utterance.pitch = 1;
      utterance.volume = 1;

      const voices = await loadVoices();
      const preferredVoice = voices.find(v =>
        v.name.includes("Google") ||
        v.name.includes("Microsoft") ||
        v.lang.includes("en-US")
      ) || voices[0];

      if (preferredVoice) {
        utterance.voice = preferredVoice;
      }

      utterance.onstart = () => {
        console.log("🔊 Speaking started");
        updateStatus("Speaking...");
        speakBtn.disabled = true;
        speakBtn.textContent = "🔊 Speaking...";
      };

      utterance.onend = () => {
        console.log("✅ Speaking ended");
        updateStatus("Ready to record", "success");
        speakBtn.disabled = false;
        speakBtn.textContent = "🔊 Speak Response";
        resolve();
      };

      utterance.onerror = (event) => {
        console.error("Speech synthesis error:", event.error);
        updateStatus("Speech error occurred", "error");
        speakBtn.disabled = false;
        speakBtn.textContent = "🔊 Speak Response";
        reject(event.error);
      };

      console.log("🔊 Speaking:", text);
      speechSynthesis.speak(utterance);
    } catch (error) {
      console.error("Speech synthesis failed:", error);
      updateStatus("Speech synthesis failed", "error");
      reject(error);
    }
  });
}


    // Event listeners
    micBtn.addEventListener("click", toggleRecording);
    speakBtn.addEventListener("click", (e) => 
    {
        e.preventDefault();
      if (currentResponse && currentResponse !== "Waiting for your input...") {
        speakText(currentResponse);
      }
    });

    async function toggleRecording() {
      if (!isRecording) {
        await startRecording();
      } else {
        stopRecording();
      }
    }

    async function startRecording() {
      try {
        updateStatus("Requesting microphone access...");
        
        const stream = await navigator.mediaDevices.getUserMedia({ 
          audio: {
            sampleRate: 16000,
            channelCount: 1,
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          }
        });
        
        const mimeType = getSupportedMimeType();
        mediaRecorder = new MediaRecorder(stream, { mimeType });
        
        audioChunks = [];
        
        mediaRecorder.ondataavailable = event => {
          if (event.data.size > 0) {
            audioChunks.push(event.data);
          }
        };

        mediaRecorder.onstop = processRecording;
        mediaRecorder.onerror = (event) => {
          updateStatus("Recording error occurred", "error");
          console.error("MediaRecorder error:", event);
        };

        mediaRecorder.start();
        isRecording = true;
        
        micBtn.classList.add("recording");
        micBtn.textContent = "🛑";
        updateStatus("Recording... Click to stop", "warning");
        
        // Auto-stop after timeout
        setTimeout(() => {
          if (isRecording) {
            stopRecording();
          }
        }, RECORDING_TIMEOUT);
        
      } catch (error) {
        updateStatus("Could not access microphone", "error");
        console.error("Recording start error:", error);
      }
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== "inactive") {
        mediaRecorder.stop();
        mediaRecorder.stream.getTracks().forEach(track => track.stop());
      }
      
      isRecording = false;
      micBtn.classList.remove("recording");
      micBtn.textContent = "🎙️";
      updateStatus("Processing audio...");
    }

    function getSupportedMimeType() {
      const types = [
        'audio/webm;codecs=opus',
        'audio/webm',
        'audio/mp4',
        'audio/wav'
      ];
      
      return types.find(type => MediaRecorder.isTypeSupported(type)) || 'audio/webm';
    }

    function audioBufferToWav(buffer) {
  const length = buffer.length;
  const numberOfChannels = buffer.numberOfChannels;
  const sampleRate = buffer.sampleRate;
  const arrayBuffer = new ArrayBuffer(44 + length * numberOfChannels * 2);
  const view = new DataView(arrayBuffer);

  const writeString = (offset, string) => {
    for (let i = 0; i < string.length; i++) {
      view.setUint8(offset + i, string.charCodeAt(i));
    }
  };

  writeString(0, 'RIFF');
  view.setUint32(4, 36 + length * numberOfChannels * 2, true);
  writeString(8, 'WAVE');
  writeString(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, numberOfChannels, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * numberOfChannels * 2, true);
  view.setUint16(32, numberOfChannels * 2, true);
  view.setUint16(34, 16, true);
  writeString(36, 'data');
  view.setUint32(40, length * numberOfChannels * 2, true);

  let offset = 44;
  for (let i = 0; i < length; i++) {
    for (let channel = 0; channel < numberOfChannels; channel++) {
      const sample = Math.max(-1, Math.min(1, buffer.getChannelData(channel)[i]));
      view.setInt16(offset, sample < 0 ? sample * 0x8000 : sample * 0x7FFF, true);
      offset += 2;
    }
  }

  return arrayBuffer;
}

async function convertToWav(blob) {
  const arrayBuffer = await blob.arrayBuffer();
  const audioContext = new (window.AudioContext || window.webkitAudioContext)();
  const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
  const wavData = audioBufferToWav(audioBuffer);
  return new Blob([wavData], { type: 'audio/wav' });
}




    async function processRecording() {
  try {
    if (audioChunks.length === 0) {
      updateStatus("No audio recorded", "error");
      return;
    }

    const webmBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType });

    if (webmBlob.size < 1000) {
      updateStatus("Audio too short, please try again", "warning");
      return;
    }

    updateStatus("Converting to WAV...");
    const wavBlob = await convertToWav(webmBlob);

    await sendAudioToServer(wavBlob);
  } catch (error) {
    updateStatus("Processing failed", "error");
    console.error("Processing error:", error);
  }
}


    async function sendAudioToServer(audioBlob) {
      const formData = new FormData();
      formData.append("file", audioBlob, "recording.webm");

      micBtn.disabled = true;
      speakBtn.style.display = "none";
      updateStatus("Sending to server...");
      
      try {
        const response = await fetch(`${SERVER_URL}/voice_input`, {
          method: "POST",
          body: formData
        });
        console.log("response:", response);

        if (!response.ok) {
          throw new Error(`Server error: ${response.status}`);
        }

        const result = await response.json();
        
        if (result.status === "success") {
          transcriptionEl.textContent = result.transcription || "No transcription available";
          responseEl.textContent = result.response || "No response available";
          currentResponse = result.response || "";
          
          if (currentResponse) {
            speakBtn.style.display = "inline-block";
            updateStatus("Response received", "success");
            
            // Auto-speak the response
            try {
              await speakText(currentResponse);
            } catch (error) {
              updateStatus("Auto-speech failed - use manual button", "warning");
            }
          }
        } else {
          throw new Error(result.message || "Unknown server error");
        }
      } catch (error) {
        updateStatus("Server connection failed", "error");
        transcriptionEl.textContent = "Connection error occurred";
        responseEl.textContent = "Please check if the server is running and try again.";
        console.error("Server error:", error);
      } finally {
        micBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
